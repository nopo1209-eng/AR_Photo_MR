<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARキャラカメラ</title>
  
  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARカメラ">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      position: relative;
    }

    /* カメラ映像 */
    #stage {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video.mirror {
      transform: scaleX(-1);
    }

    /* キャラコンテナ */
    #overlay-container {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 220px;
      touch-action: none;
      cursor: move;
      user-select: none;
      z-index: 2;
    }
    #overlay-char {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* 看板上のテキスト表示 */
    #sign-text-overlay {
      display: none;
      position: absolute;
      top: 60%;
      left: 38%;
      width: 44%;
      height: 28%;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      line-height: 1.25;
      text-align: center;
      word-break: break-all;
      white-space: pre-wrap;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    /* 操作エリア */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* 看板用テキスト入力欄 */
    #text-input-container {
      display: none;
      width: 100%;
    }
    #sign-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #00ffcc;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      font-size: 14px;
      text-align: center;
      outline: none;
    }

    /* サムネイル */
    .char-select {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      justify-content: center;
    }
    .char-select img {
      height: 42px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .char-select img.active { border-color: #00ffcc; }

    /* ボタン群レイアウト */
    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    /* 撮影ボタン */
    .btn-shutter {
      flex: 1;
      padding: 10px 0;
      font-size: 15px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      color: white;
      border: none;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(255, 0, 127, 0.4);
      cursor: pointer;
    }

    /* カメラ切替ボタン */
    .btn-switch {
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      cursor: pointer;
    }

    /* モーダル */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    #preview-img {
      max-width: 90%;
      max-height: 70dvh;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .modal-btns { display: flex; gap: 15px; }
    .btn-action {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 20px;
      border: none;
    }
    .btn-save { background: #00ffcc; color: #000; }
    .btn-retry { background: #555; color: #fff; }

    canvas { display: none; }
  </style>
</head>
<body>

  <div id="stage">
    <video id="camera" autoplay playsinline muted></video>
  </div>

  <div id="overlay-container">
    <img id="overlay-char" src="mellow_reel_duo.png" alt="character">
    <div id="sign-text-overlay"></div>
  </div>

  <div id="controls">
    <div id="text-input-container">
      <input type="text" id="sign-input" placeholder="看板の文字を入力..." value="2026.9.19" oninput="updateSignText()">
    </div>
    <div class="char-select">
      <img src="mellow_reel_duo.png" class="active" onclick="selectChar(this, 'mellow_reel_duo.png')">
      <img src="mellow_standing.png" onclick="selectChar(this, 'mellow_standing.png')">
      <img src="mellow_upside_down.png" onclick="selectChar(this, 'mellow_upside_down.png')">
      <img src="reel_peeking.png" onclick="selectChar(this, 'reel_peeking.png')">
      <img src="reel_sign.png" onclick="selectChar(this, 'reel_sign.png')">
    </div>
    <div class="btn-group">
      <button class="btn-switch" onclick="toggleCamera()">🔄 切替</button>
      <button class="btn-shutter" onclick="takePhoto()">📷 写真を撮る</button>
    </div>
  </div>

  <div id="modal">
    <img id="preview-img" src="" alt="preview">
    <div class="modal-btns">
      <button class="btn-action btn-retry" onclick="closeModal()">撮り直す</button>
      <button class="btn-action btn-save" onclick="savePhoto()">保存 / シェア</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('camera');
    const container = document.getElementById('overlay-container');
    const overlayChar = document.getElementById('overlay-char');
    const signTextOverlay = document.getElementById('sign-text-overlay');
    const textInputContainer = document.getElementById('text-input-container');
    const signInput = document.getElementById('sign-input');
    const canvas = document.getElementById('canvas');
    const modal = document.getElementById('modal');
    const previewImg = document.getElementById('preview-img');

    let currentDataUrl = '';
    let isSignSelected = false;
    let currentStream = null;
    let useFacingMode = "environment";

    let state = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, initialDist: 0, initialScale: 1 };

    function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: useFacingMode },
        audio: false
      }).then(stream => {
        currentStream = stream;
        video.srcObject = stream;
        if (useFacingMode === "user") {
          video.classList.add('mirror');
        } else {
          video.classList.remove('mirror');
        }
      }).catch(err => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(stream => {
            currentStream = stream;
            video.srcObject = stream;
          });
      });
    }

    startCamera();

    function toggleCamera() {
      useFacingMode = (useFacingMode === "environment") ? "user" : "environment";
      startCamera();
    }

    function resetCharPos() {
      state.x = 0; state.y = 0; state.scale = 1;
      updateTransform();
    }

    function updateTransform() {
      container.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    function updateSignText() {
      signTextOverlay.innerText = signInput.value;
    }

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        state.lastX = e.touches[0].clientX - state.x;
        state.lastY = e.touches[0].clientY - state.y;
      } else if (e.touches.length === 2) {
        state.initialDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        state.initialScale = state.scale;
      }
    });

    container.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        state.x = e.touches[0].clientX - state.lastX;
        state.y = e.touches[0].clientY - state.lastY;
        updateTransform();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        state.scale = Math.max(0.3, Math.min(3, state.initialScale * (dist / state.initialDist)));
        updateTransform();
      }
    });

    function selectChar(el, filename) {
      document.querySelectorAll('.char-select img').forEach(img => img.classList.remove('active'));
      el.classList.add('active');
      overlayChar.src = filename;

      isSignSelected = filename.includes('reel_sign.png');
      if (isSignSelected) {
        textInputContainer.style.display = 'block';
        signTextOverlay.style.display = 'flex';
        updateSignText();
      } else {
        textInputContainer.style.display = 'none';
        signTextOverlay.style.display = 'none';
      }

      resetCharPos();
    }

    function takePhoto() {
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;

      if (useFacingMode === "user") {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }

      const charImg = new Image();
      charImg.src = overlayChar.src;
      charImg.onload = () => {
        const stage = document.getElementById('stage');
        const scaleX = canvas.width / stage.clientWidth;
        const scaleY = canvas.height / stage.clientHeight;

        const rect = overlayChar.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        const x = (rect.left - stageRect.left) * scaleX;
        const y = (rect.top - stageRect.top) * scaleY;
        const w = rect.width * scaleX;
        const aspectRatio = charImg.naturalHeight / charImg.naturalWidth;
        const h = w * aspectRatio;

        ctx.drawImage(charImg, x, y, w, h);

        if (isSignSelected && signInput.value) {
          ctx.save();

          const baseFontSize = 13;
          const fontSize = baseFontSize * scaleX * state.scale;
          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const maxLineWidth = w * 0.44;
          const text = signInput.value;
          let lines = [];
          let currentLine = '';

          for (let i = 0; i < text.length; i++) {
            let char = text[i];
            let testLine = currentLine + char;
            if (ctx.measureText(testLine).width > maxLineWidth && i > 0) {
              lines.push(currentLine);
              currentLine = char;
            } else {
              currentLine = testLine;
            }
          }
          if (currentLine) {
            lines.push(currentLine);
          }

          const centerX = x + (w * 0.60);
          const centerY = y + (h * 0.74);
          const lineHeight = fontSize * 1.25;

          const startY = centerY - ((lines.length - 1) * lineHeight / 2);

          lines.forEach((line, index) => {
            ctx.fillText(line, centerX, startY + (index * lineHeight));
          });

          ctx.restore();
        }

        currentDataUrl = canvas.toDataURL('image/png');
        previewImg.src = currentDataUrl;
        modal.style.display = 'flex';
      };
    }

    function closeModal() { modal.style.display = 'none'; }

    async function savePhoto() {
      if (!currentDataUrl) return;
      const blob = await (await fetch(currentDataUrl)).blob();
      const file = new File([blob], `ar_photo_${Date.now()}.png`, { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'ARキャラフォト',
            text: '#フリーダムベル朗読会 #メロウとリール'
          });
        } catch (e) {}
      } else {
        const link = document.createElement('a');
        link.download = file.name;
        link.href = currentDataUrl;
        link.click();
      }
    }

    // PWA Service Worker 登録処理
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
