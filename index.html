<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARキャラカメラ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      position: relative;
    }

    /* カメラ映像 */
    #stage {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* キャラ画像 */
    #overlay-char {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 200px;
      height: auto;
      object-fit: contain;
      touch-action: none;
      cursor: move;
      user-select: none;
      z-index: 2;
    }

    /* 操作エリア */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* サムネイル */
    .char-select {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      justify-content: center;
    }
    .char-select img {
      height: 42px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .char-select img.active { border-color: #00ffcc; }

    /* 撮影ボタン */
    .btn-shutter {
      width: 80%;
      padding: 10px 0;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff007f, #7f00ff);
      color: white;
      border: none;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(255, 0, 127, 0.4);
      cursor: pointer;
    }

    /* 撮影後モーダル */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    #preview-img {
      max-width: 90%;
      max-height: 70dvh;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .modal-btns { display: flex; gap: 15px; }
    .btn-action {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 20px;
      border: none;
    }
    .btn-save { background: #00ffcc; color: #000; }
    .btn-retry { background: #555; color: #fff; }

    canvas { display: none; }
  </style>
</head>
<body>

  <div id="stage">
    <video id="camera" autoplay playsinline muted></video>
  </div>

  <img id="overlay-char" src="mellow_reel_duo.png" alt="character">

  <div id="controls">
    <div class="char-select">
      <img src="mellow_reel_duo.png" class="active" onclick="selectChar(this, 'mellow_reel_duo.png')">
      <img src="mellow_upside_down.png" onclick="selectChar(this, 'mellow_upside_down.png')">
      <img src="reel_peeking.png" onclick="selectChar(this, 'reel_peeking.png')">
      <img src="reel_sign.png" onclick="selectChar(this, 'reel_sign.png')">
      <img src="mellow_standing.png" onclick="selectChar(this, 'mellow_standing.png')">
    </div>
    <button class="btn-shutter" onclick="takePhoto()">📷 写真を撮る</button>
  </div>

  <div id="modal">
    <img id="preview-img" src="" alt="preview">
    <div class="modal-btns">
      <button class="btn-action btn-retry" onclick="closeModal()">撮り直す</button>
      <button class="btn-action btn-save" onclick="savePhoto()">保存 / シェア</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('camera');
    const overlayChar = document.getElementById('overlay-char');
    const canvas = document.getElementById('canvas');
    const modal = document.getElementById('modal');
    const previewImg = document.getElementById('preview-img');

    let currentDataUrl = '';

    // トランスフォーム管理（移動・拡大）
    let state = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, initialDist: 0, initialScale: 1 };

    // 1. カメラ起動
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" } },
      audio: false
    }).then(stream => { video.srcObject = stream; })
      .catch(() => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(stream => video.srcObject = stream);
      });

    // 初期位置リセット
    function resetCharPos() {
      state.x = 0; state.y = 0; state.scale = 1;
      updateTransform();
    }

    function updateTransform() {
      overlayChar.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    // 2. タッチ操作（ドラッグ ＆ ピンチズーム）
    overlayChar.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        state.lastX = e.touches[0].clientX - state.x;
        state.lastY = e.touches[0].clientY - state.y;
      } else if (e.touches.length === 2) {
        state.initialDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        state.initialScale = state.scale;
      }
    });

    overlayChar.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        state.x = e.touches[0].clientX - state.lastX;
        state.y = e.touches[0].clientY - state.lastY;
        updateTransform();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        state.scale = Math.max(0.3, Math.min(3, state.initialScale * (dist / state.initialDist)));
        updateTransform();
      }
    });

    // 3. キャラ変更
    function selectChar(el, filename) {
      document.querySelectorAll('.char-select img').forEach(img => img.classList.remove('active'));
      el.classList.add('active');
      overlayChar.src = filename;
      resetCharPos();
    }

    // 4. 撮影処理（アスペクト比を保持して描画）
    function takePhoto() {
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;

      // カメラ映像を描画
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const charImg = new Image();
      charImg.src = overlayChar.src;
      charImg.onload = () => {
        const stage = document.getElementById('stage');
        const scaleX = canvas.width / stage.clientWidth;
        const scaleY = canvas.height / stage.clientHeight;

        const rect = overlayChar.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        // 描画位置
        const x = (rect.left - stageRect.left) * scaleX;
        const y = (rect.top - stageRect.top) * scaleY;

        // 描画サイズ（縦横比を絶対維持）
        const w = rect.width * scaleX;
        const aspectRatio = charImg.naturalHeight / charImg.naturalWidth;
        const h = w * aspectRatio;

        // キャラ描画
        ctx.drawImage(charImg, x, y, w, h);

        currentDataUrl = canvas.toDataURL('image/png');
        previewImg.src = currentDataUrl;
        modal.style.display = 'flex';
      };
    }

    function closeModal() { modal.style.display = 'none'; }

    // 5. 保存 ＆ シェア
    async function savePhoto() {
      if (!currentDataUrl) return;
      const blob = await (await fetch(currentDataUrl)).blob();
      const file = new File([blob], `ar_photo_${Date.now()}.png`, { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'ARキャラフォト',
            text: '#村椿朗読会 #メロウとリール'
          });
        } catch (e) {}
      } else {
        const link = document.createElement('a');
        link.download = file.name;
        link.href = currentDataUrl;
        link.click();
      }
    }
  </script>
</body>
</html>
